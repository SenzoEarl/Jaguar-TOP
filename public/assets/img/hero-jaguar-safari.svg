<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Jaguar Safari Sanctuary at Golden Dusk">
  <title>Jaguar Safari Panorama — Reserve Sanctuary at Dusk</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f18"/>
      <stop offset="48%" stop-color="#1b4332"/>
      <stop offset="82%" stop-color="#7c5b38"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="62%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#fefae0" stop-opacity="0.95"/>
      <stop offset="32%" stop-color="#e9c46a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#d4a373" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#274e3e"/>
      <stop offset="50%" stop-color="#153227"/>
      <stop offset="100%" stop-color="#0b1f18"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283d33"/>
      <stop offset="100%" stop-color="#0e221b"/>
    </linearGradient>
  </defs>

  <!-- Twilight Sky -->
  <rect width="960" height="620" fill="url(#skyGrad)"/>
  <circle cx="595" cy="340" r="215" fill="url(#sunGlow)"/>
  <circle cx="595" cy="340" r="64" fill="#fefae0" opacity="0.92"/>
  <circle cx="595" cy="340" r="82" fill="none" stroke="#e9c46a" stroke-width="2" opacity="0.45"/>

  <!-- Subtle Stars -->
  <g fill="#fefae0" opacity="0.65">
    <circle cx="115" cy="82" r="1.5"/>
    <circle cx="205" cy="54" r="1.8"/>
    <circle cx="290" cy="112" r="1.2"/>
    <circle cx="430" cy="68" r="1.6"/>
    <circle cx="745" cy="72" r="1.8"/>
    <circle cx="845" cy="108" r="1.4"/>
    <circle cx="890" cy="60" r="1.2"/>
  </g>

  <!-- Distant Ridges -->
  <path d="M0 365 Q140 310 310 348 T630 328 T960 352 L960 440 L0 440 Z" fill="#18382a" opacity="0.88"/>
  <path d="M0 390 Q190 350 385 380 T750 362 T960 385 L960 450 L0 450 Z" fill="#132e22"/>

  <!-- Reserve Lagoon & Sun Shimmer -->
  <rect x="0" y="420" width="960" height="200" fill="url(#waterGrad)"/>
  <g fill="#e9c46a" opacity="0.35">
    <rect x="535" y="434" width="120" height="4" rx="2"/>
    <rect x="550" y="446" width="90" height="3.5" rx="2"/>
    <rect x="525" y="459" width="140" height="3" rx="1.5"/>
    <rect x="562" y="472" width="68" height="2.5" rx="1.2"/>
    <rect x="546" y="486" width="96" height="2" rx="1"/>
  </g>

  <!-- Left Acacia Silhouette & Timber Safari Lodge -->
  <g fill="#0c2019">
    <path d="M74 422 V255 M74 300 L42 252 M74 282 L114 246" stroke="#0c2019" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="48" cy="240" rx="46" ry="15"/>
    <ellipse cx="102" cy="234" rx="54" ry="16"/>
    <ellipse cx="145" cy="248" rx="34" ry="11"/>
    <!-- Timber Lodge Deck -->
    <polygon points="150,375 268,332 386,375" fill="#102a22"/>
    <rect x="172" y="375" width="192" height="50" fill="#102a22"/>
    <rect x="155" y="418" width="226" height="9" fill="#091812"/>
  </g>
  <!-- Warm Lantern Windows -->
  <g fill="#e9c46a">
    <rect x="194" y="388" width="28" height="22" rx="2" opacity="0.92"/>
    <rect x="234" y="386" width="44" height="24" rx="2" opacity="0.95"/>
    <rect x="290" y="388" width="28" height="22" rx="2" opacity="0.9"/>
    <rect x="330" y="392" width="18" height="18" rx="2" opacity="0.82"/>
  </g>
  <g fill="#fefae0" opacity="0.22">
    <rect x="194" y="434" width="28" height="18" rx="2"/>
    <rect x="234" y="434" width="44" height="22" rx="2"/>
    <rect x="290" y="434" width="28" height="18" rx="2"/>
  </g>

  <!-- Foreground Sandstone Outcrop on Right -->
  <path d="M510 620 L585 492 L695 454 L835 446 L960 468 L960 620 Z" fill="url(#rockGrad)"/>
  <path d="M585 492 L695 454 L835 446 L960 468" fill="none" stroke="#d4a373" stroke-width="2.5" opacity="0.45"/>

  <!-- Proud Jaguar Silhouette Stalking Outcrop -->
  <g transform="translate(605, 316)">
    <!-- Curved Tail -->
    <path d="M196 108 C236 106, 268 82, 260 54 C256 42, 244 42, 240 50" fill="none" stroke="#081611" stroke-width="11" stroke-linecap="round"/>
    <!-- Body, Chest, Haunches & Paws -->
    <path d="M62 80 C95 62, 148 58, 198 76 C214 82, 218 96, 206 112 L195 142 L177 142 L182 108 L152 106 L142 142 L126 142 L134 102 C108 104, 86 108, 70 116 L60 144 L44 144 L54 102 L38 118 L24 142 L9 142 L34 94 C36 74, 42 58, 52 50 L44 36 L55 32 L64 41 C72 40, 79 44, 83 50 L89 58 L78 68 L62 80 Z" fill="#081611"/>
    <!-- Rim Accent Along Crown & Back -->
    <path d="M48 49 C56 40, 72 40, 82 50 M92 68 C130 58, 168 62, 200 78" fill="none" stroke="#e9c46a" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
    <!-- Golden Rosettes Motif -->
    <g fill="none" stroke="#d4a373" stroke-width="1.8" opacity="0.48">
      <circle cx="115" cy="82" r="5"/>
      <circle cx="136" cy="77" r="4.5"/>
      <circle cx="156" cy="86" r="5"/>
      <circle cx="176" cy="84" r="4.2"/>
      <circle cx="144" cy="95" r="4"/>
    </g>
    <!-- Gleaming Amber Eye -->
    <circle cx="49" cy="54" r="2.4" fill="#e9c46a"/>
  </g>

  <!-- Framing Savannah Grass Tufts -->
  <path d="M22 620 C26 575, 42 555, 52 536 C46 565, 44 590, 48 620 M65 620 C72 582, 86 560, 98 544 C88 574, 86 595, 88 620 M860 620 C866 582, 878 564, 892 548 C882 574, 882 595, 886 620" fill="#07130f"/>
</svg>
